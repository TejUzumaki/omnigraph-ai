<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI SVG Studio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- FULL-BLEED CANVAS -->
    <div id="canvas-container">
        <svg id="canvas" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- FLOATING ACTION BUTTONS -->
    <div class="fab-stack">
        <button class="fab" onclick="toggleTray()">⚙️</button>
    </div>

    <!-- COLLAPSIBLE BOTTOM TRAY -->
    <div id="tray" class="tray collapsed">
        <div class="tray-handle" onclick="toggleTray()"></div>
        
        <!-- AI BOARD SECTION -->
        <div class="tray-section ai-board">
            <div id="chat_log"></div>
            <div class="input-row">
                <textarea id="prompt" placeholder="Type or use mic... (/create to generate)"></textarea>
                <button id="mic-btn" class="chip-mic" onclick="toggleMic()">🎙️</button>
                <button class="chip-send" onclick="sendPrompt()">➤</button>
            </div>
        </div>

        <!-- ANIMATION CHIPS SECTION -->
        <div class="tray-section">
            <h4>Animations</h4>
            <div class="chips-scroll">
                <div class="chip" onclick="applyAnimation('Swing', 'swing 1s ease-in-out infinite')">Swing</div>
                <div class="chip" onclick="applyAnimation('Pulse', 'pulse 1.5s ease-in-out infinite')">Pulse</div>
                <div class="chip" onclick="applyAnimation('Levitate', 'levitate 2s ease-in-out infinite')">Levitate</div>
                <div class="chip" onclick="applyAnimation('Rotate', 'rotate 2s linear infinite')">Rotate</div>
            </div>
        </div>

        <!-- LAYERS SECTION -->
        <div class="tray-section">
            <h4>Layers</h4>
            <div id="layers_list" class="layers-grid"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
