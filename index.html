<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SVG Studio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- TOP 80%: EDITOR -->
    <div class="editor-section">
        <div class="left-panel">
            <h3>Animation Code</h3>
            <textarea id="css_code" placeholder="@keyframes walk { 0% {transform: rotate(0deg);} 100% {transform: rotate(20deg);} }"></textarea>
            <button onclick="applyAnimation()">Apply Keyframes</button>
        </div>
        <div class="canvas-panel">
            <div class="canvas-wrap">
                <svg id="canvas" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="hint">Drag layers to reposition.</div>
        </div>
        <div class="right-panel">
            <h3>Layers & Props</h3>
            <div id="layers_list"></div>
        </div>
    </div>

    <!-- BOTTOM 20%: AI BOARD -->
    <div class="ai-section">
        <div id="chat_log"></div>
        <div class="input-row">
            <textarea id="prompt" placeholder="Type or use mic... (Prefix with /create to generate SVG)"></textarea>
            <button id="mic-btn" onclick="toggleMic()">🎙️</button>
            <button onclick="sendPrompt()">Send</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
